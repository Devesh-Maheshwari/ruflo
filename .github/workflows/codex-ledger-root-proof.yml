name: PR4048 root suite proof

on:
  push:
    branches: [ci/codex-ledger-root-proof]

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-retry

      - name: Build workspace-linked packages needed at runtime by tests
        # `npm ci` at repo root links @claude-flow/security in via the root
        # npm workspace (package-lock.json records it as a `link: true`
        # entry resolving to v3/@claude-flow/security, not a registry
        # fetch) but never builds it, so importers hit
        # ERR_MODULE_NOT_FOUND on its dist/index.js at runtime — a
        # pre-existing gap (see v3/@claude-flow/cli/__tests__/policy-runtime.test.ts's
        # long-standing scripts/ci-test-baseline.txt entry for the same
        # root cause) that a second, unrelated package now also needs
        # built for: dual-mode.test.ts/dual-mode-stdin-2947.test.ts import
        # @claude-flow/security for the first time in @claude-flow/codex.
        # (Complements, not duplicates, the codex package-lock.json fix
        # above it in history — that made npm ci link the package for
        # codex at all; this makes the linked package actually runnable.)
        run: npm run build --workspace=@claude-flow/security

      - name: Build local @claude-flow/cli-core and overlay onto the installed package
        # dream-cycle 2026-09-21: unlike @claude-flow/security above,
        # package-lock.json resolves @claude-flow/cli-core from the
        # published npm registry tarball (not an npm workspace `link`),
        # even though its version (3.7.0-alpha.5) matches the local
        # v3/@claude-flow/cli-core source exactly. `node scripts/ci-test-ratchet.mjs`
        # below runs vitest from repo root, so v3/@claude-flow/cli's tests
        # resolve `@claude-flow/cli-core` by walking up to the root's
        # node_modules — the stale published dist/, not local source edits.
        # This surfaced when validate-input-env.test.ts's new assertions
        # (PR #3385) passed locally but failed in CI against the untouched
        # published denylist. Building the local source and overlaying its
        # dist/ onto the installed package (same version, so this is not a
        # version bump) makes CI test the actual PR diff instead of a
        # stale registry snapshot, without touching package-lock.json.
        run: |
          npm run build --prefix v3/@claude-flow/cli-core
          rm -rf node_modules/@claude-flow/cli-core/dist
          cp -r v3/@claude-flow/cli-core/dist node_modules/@claude-flow/cli-core/dist

      - name: Run all tests
        # #3030: the historical suite has known debt, but new failing files
        # are release-blocking. The committed file-level baseline may only
        # shrink; replacing an old failure with a new one still fails.
        run: node scripts/ci-test-ratchet.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: .test-results/vitest.json
          if-no-files-found: error

